# secrethound 기본 룰셋
#
# [중요] Go의 regexp 패키지는 RE2 엔진을 사용한다.
# lookahead(?=), lookbehind(?<=), 백레퍼런스(\1)를 지원하지 않으므로 사용 금지.
# (?i) 인라인 플래그와 \b 단어경계는 사용 가능하다.
#
# 필드 설명
#   id          : 룰 식별자 (리포트/화이트리스트에서 참조)
#   description : 사람이 읽는 설명
#   severity    : critical | high | medium | low
#   keywords    : 정규식 실행 전 1차 필터. 라인에 이 문자열이 없으면 정규식을 건너뛴다(성능 최적화)
#   regex       : 탐지 정규식
#   secret_group: 실제 시크릿 값이 담긴 캡처 그룹 번호 (0 = 전체 매치)
#   entropy     : 매치된 값의 최소 Shannon 엔트로피. 미달 시 탈락 (선택)
#   tags        : 분류용 태그
#   remediation : 이 키를 발급처에서 폐기(revoke)하는 절차 안내. 리포트의 Finding에
#                 그대로 실린다 (탐지에서 대응까지 연결하는 것이 목적)

version: 1

rules:
  # ---------------------------------------------------------------- AWS
  - id: aws-access-key-id
    description: AWS Access Key ID
    severity: high
    keywords: [AKIA, ASIA, ABIA, ACCA, A3T]
    regex: '\b((A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16})\b'
    secret_group: 1
    tags: [aws, cloud]
    remediation: >-
      AWS Console → IAM → 사용자 → 보안 자격 증명에서 이 Access Key를 비활성화 후 삭제.
      짝이 되는 Secret Access Key도 함께 무효화되므로 재발급이 필요하다.

  - id: aws-secret-access-key
    description: AWS Secret Access Key (키워드 컨텍스트 기반)
    severity: critical
    keywords: [aws, secret]
    # ~/.aws/credentials 는 INI 형식이라 값에 따옴표가 없다. 따옴표를 필수로 두면
    # 가장 흔한 AWS 자격증명 파일을 통째로 놓친다.
    # 대신 40자 뒤에 같은 문자 클래스가 이어지지 않도록 경계를 둬서 더 긴 토큰의
    # 일부를 잘라 잡는 일을 줄인다. (RE2는 lookahead가 없어 경계 문자를 소비한다)
    regex: '(?i)aws[_\-. ]?(secret[_\-. ]?)?(access[_\-. ]?)?key[^a-zA-Z0-9]{0,20}[''"]?([A-Za-z0-9/+=]{40})(?:[^A-Za-z0-9/+=]|$)'
    secret_group: 3
    entropy: 4.2
    tags: [aws, cloud]
    remediation: >-
      AWS Console → IAM → 사용자 → 보안 자격 증명에서 짝이 되는 Access Key를 찾아 비활성화
      후 삭제. Secret Access Key 단독으로는 콘솔에서 조회·삭제할 수 없으므로 Access Key ID를
      함께 찾아야 한다.

  # terraform/보일러플레이트 설정에서는 `secret_key = "..."` 처럼 줄에 aws 접두사가 없다.
  # 위 룰이 이런 형태를 놓치면 범용 룰이 대신 잡아 심각도가 낮게 보고되므로 별도 룰로 처리한다.
  # 길이 40의 base64 + 높은 엔트로피는 AWS 시크릿 키의 고유 특성이라 오탐 위험이 낮다.
  - id: aws-secret-access-key-bare
    description: AWS Secret Access Key (aws 접두사 없는 secret_key 형태)
    severity: critical
    keywords: [secret_key, secret-key, secretkey, secret_access_key]
    regex: '(?i)\b(secret[_\-. ]?access[_\-. ]?key|secret[_\-. ]?key)\b[^a-zA-Z0-9]{0,20}[''"]?([A-Za-z0-9/+=]{40})(?:[^A-Za-z0-9/+=]|$)'
    secret_group: 2
    entropy: 4.2
    tags: [aws, cloud]
    remediation: >-
      AWS Console → IAM → 사용자 → 보안 자격 증명에서 짝이 되는 Access Key를 찾아 비활성화
      후 삭제. Secret Access Key 단독으로는 콘솔에서 조회·삭제할 수 없으므로 Access Key ID를
      함께 찾아야 한다.

  - id: aws-session-token
    description: AWS Session Token
    severity: high
    keywords: [aws_session_token, x-amz-security-token]
    regex: '(?i)(aws[_\-.]?session[_\-.]?token|x-amz-security-token)[^a-zA-Z0-9]{0,20}[''"]?([A-Za-z0-9/+=]{100,})'
    secret_group: 2
    tags: [aws, cloud]
    remediation: >-
      임시 자격 증명이라 만료되면 자동으로 무효화되지만, 발급한 근원 자격 증명(IAM 사용자/역할)이
      노출된 것일 수 있으므로 해당 사용자·역할의 액세스 키도 함께 점검하고 필요시 폐기하라.

  # ---------------------------------------------------------------- GitHub
  - id: github-pat
    description: GitHub Personal Access Token (classic)
    severity: critical
    keywords: [ghp_]
    regex: '\b(ghp_[A-Za-z0-9]{36})\b'
    secret_group: 1
    tags: [github, vcs]
    remediation: >-
      GitHub → Settings → Developer settings → Personal access tokens에서 해당 토큰을
      Delete(폐기).

  - id: github-fine-grained-pat
    description: GitHub Fine-grained Personal Access Token
    severity: critical
    keywords: [github_pat_]
    regex: '\b(github_pat_[A-Za-z0-9_]{82})\b'
    secret_group: 1
    tags: [github, vcs]
    remediation: >-
      GitHub → Settings → Developer settings → Fine-grained personal access tokens에서
      해당 토큰을 Delete(폐기).

  - id: github-oauth-token
    description: GitHub OAuth / App / Refresh Token
    severity: critical
    keywords: [gho_, ghu_, ghs_, ghr_]
    regex: '\b((gho|ghu|ghs|ghr)_[A-Za-z0-9]{36})\b'
    secret_group: 1
    tags: [github, vcs]
    remediation: >-
      발급한 OAuth App 또는 GitHub App 설정(Settings → Developer settings)에서 해당
      사용자의 인가(authorization)를 취소하거나 App을 Uninstall해 토큰을 즉시 무효화하라.

  # 2024년 이후 GitLab이 발급하는 PAT는 라우터블 토큰 형식이라
  # glpat-<본문>.<2자 체크섬>.<나머지> 처럼 마침표를 포함한다.
  # 기존 정규식은 마침표를 허용하지 않아 이 형식을 통째로 놓쳤다 —
  # 실제 발급받은 키로 --validate 검증하다가 발견한 결함이다 (eval/labels.yaml 참고).
  # 구형식(마침표 없는 20자)과 신형식을 모두 받도록 마침표 구간을 선택적으로 둔다.
  - id: gitlab-pat
    description: GitLab Personal Access Token
    severity: critical
    keywords: [glpat-]
    regex: '\b(glpat-[A-Za-z0-9\-_]{20,}(?:\.[A-Za-z0-9\-_]{2}\.[A-Za-z0-9\-_]+)?)\b'
    secret_group: 1
    tags: [gitlab, vcs]
    remediation: >-
      GitLab → User Settings → Access Tokens에서 해당 토큰을 Revoke.

  # ---------------------------------------------------------------- Slack
  - id: slack-token
    description: Slack Token (bot / user / workspace)
    severity: critical
    keywords: [xoxb-, xoxp-, xoxa-, xoxr-, xoxs-]
    regex: '\b(xox[baprs]-[0-9A-Za-z\-]{10,72})\b'
    secret_group: 1
    tags: [slack, messaging]
    remediation: >-
      api.slack.com/apps에서 해당 App 선택 → OAuth & Permissions → Revoke Token,
      또는 App을 워크스페이스에서 재설치해 토큰을 새로 발급한다.

  - id: slack-app-token
    description: Slack App-Level Token
    severity: high
    keywords: [xapp-]
    regex: '\b(xapp-[0-9]-[A-Z0-9]+-[0-9]+-[a-f0-9]{64})\b'
    secret_group: 1
    tags: [slack, messaging]
    remediation: >-
      api.slack.com/apps에서 해당 App 선택 → Basic Information → App-Level Tokens에서
      해당 토큰을 삭제.

  - id: slack-webhook
    description: Slack Incoming Webhook URL
    severity: high
    keywords: ['hooks.slack.com']
    regex: '(https://hooks\.slack\.com/services/T[A-Za-z0-9_]{8,12}/B[A-Za-z0-9_]{8,12}/[A-Za-z0-9_]{24})'
    secret_group: 1
    tags: [slack, webhook]
    remediation: >-
      api.slack.com/apps에서 해당 App 선택 → Incoming Webhooks에서 이 Webhook URL을 Remove.

  # ---------------------------------------------------------------- 결제
  - id: stripe-secret-key
    description: Stripe Secret / Restricted Key (live)
    severity: critical
    keywords: [sk_live_, rk_live_]
    regex: '\b((sk|rk)_live_[0-9A-Za-z]{24,99})\b'
    secret_group: 1
    tags: [stripe, payment]
    remediation: >-
      Stripe Dashboard → Developers → API keys에서 해당 키를 Roll(재발급). 즉시 이전 키는
      무효화된다.

  # Stripe 테스트 키(sk_test_)는 룰에서 제외한다.
  # 실제 결제가 불가능해 유출 피해가 없고, 값에 test 가 들어가 플레이스홀더 감점에
  # 항상 걸려 리포트에 도달하지 못한다. 도달 불가능한 룰은 커버리지 착시만 만든다.

  # Stripe publishable key(pk_live_)는 클라이언트에 노출되도록 설계된 공개값이라
  # 룰에서 제외한다. 평가 코퍼스에서 오탐만 만들고 탐지 가치가 없음을 확인했다.

  # ---------------------------------------------------------------- Google
  - id: google-api-key
    description: Google API Key
    severity: high
    keywords: [AIza]
    regex: '\b(AIza[0-9A-Za-z\-_]{35})\b'
    secret_group: 1
    tags: [google, cloud]
    remediation: >-
      Google Cloud Console → APIs & Services → Credentials에서 해당 키를 삭제하고
      재발급. 삭제 전에 임시로 API 제한(허용 API/리퍼러)을 걸어두면 즉시 피해를 줄일 수 있다.

  # Google OAuth Client ID도 같은 이유로 제외한다. 공개 식별자이며 그 자체로는 유출이 아니다.

  # GCP 서비스 계정 JSON의 `"type": "service_account"` 는 파일 종류 표시일 뿐
  # 자격증명이 아니라서 룰에서 제외했다. 이 파일의 실제 시크릿인 private_key 필드는
  # private-key 룰이 잡는다. 표시 줄을 시크릿으로 보고하면 위치가 틀린 탐지가 된다.

  # ---------------------------------------------------------------- AI / SaaS
  - id: openai-api-key
    description: OpenAI API Key
    severity: critical
    keywords: [sk-]
    regex: '\b(sk-(proj-)?[A-Za-z0-9\-_]{20,}T3BlbkFJ[A-Za-z0-9\-_]{20,})\b'
    secret_group: 1
    tags: [ai, saas]
    remediation: >-
      platform.openai.com → API keys에서 해당 키를 Revoke.

  - id: anthropic-api-key
    description: Anthropic API Key
    severity: critical
    keywords: [sk-ant-]
    regex: '\b(sk-ant-[A-Za-z0-9\-_]{90,})\b'
    secret_group: 1
    tags: [ai, saas]
    remediation: >-
      console.anthropic.com → API Keys에서 해당 키를 삭제.

  - id: sendgrid-api-key
    description: SendGrid API Key
    severity: critical
    keywords: ['SG.']
    regex: '\b(SG\.[A-Za-z0-9\-_]{22}\.[A-Za-z0-9\-_]{43})\b'
    secret_group: 1
    tags: [email, saas]
    remediation: >-
      SendGrid → Settings → API Keys에서 해당 키를 Delete.

  - id: mailgun-api-key
    description: Mailgun API Key
    severity: high
    keywords: [key-]
    regex: '\b(key-[0-9a-f]{32})\b'
    secret_group: 1
    tags: [email, saas]
    remediation: >-
      Mailgun → Sending → Domain settings 또는 계정 API Keys 화면에서 해당 키를 재발급.

  - id: twilio-api-key
    description: Twilio API Key SID
    severity: high
    keywords: [SK, twilio]
    # TWILIO_API_KEY= 처럼 단어가 이어지는 형태를 허용한다 (heroku 룰과 동일한 이유).
    # 값 자체(SK+32hex)만으로는 시크릿이라 단정할 수 없어 twilio 컨텍스트는 유지한다.
    # 그 결과 키 이름과 값이 다른 줄에 있으면 매칭되지 않는다 (줄 단위 스캔의 한계).
    regex: '(?i)twilio[_\-. ]?(api[_\-. ]?)?(key|sid|token)?[^a-zA-Z0-9]{0,20}[''"]?(SK[0-9a-fA-F]{32})'
    secret_group: 3
    tags: [twilio, saas]
    remediation: >-
      Twilio Console → Account → API keys & tokens에서 해당 API Key를 삭제. Auth Token이
      함께 노출됐다면 별도로 Rotate해야 한다(같은 화면에서 재생성 가능).

  - id: npm-access-token
    description: npm Access Token
    severity: critical
    keywords: [npm_]
    regex: '\b(npm_[A-Za-z0-9]{36})\b'
    secret_group: 1
    tags: [npm, package-registry]
    remediation: >-
      npmjs.com → Access Tokens에서 해당 토큰을 Revoke.

  - id: shopify-access-token
    description: Shopify Access Token
    severity: critical
    keywords: [shpat_, shpca_, shppa_, shpss_]
    regex: '\b(shp(at|ca|pa|ss)_[a-fA-F0-9]{32})\b'
    secret_group: 1
    tags: [shopify, saas]
    remediation: >-
      Shopify Admin → Apps and sales channels → 해당 앱 설정에서 접근을 Uninstall하거나
      Custom App이면 API credentials를 재생성.

  - id: discord-bot-token
    description: Discord Bot Token
    severity: high
    keywords: [discord]
    # discordBotToken 처럼 변수명이 camelCase로 이어지는 경우가 흔하므로
    # discord 뒤에 bot/token 단어가 붙는 것을 허용한다.
    regex: '(?i)discord[_\-. ]?(bot)?[_\-. ]?(token)?[^a-zA-Z0-9]{0,20}([MNO][A-Za-z0-9\-_]{23}\.[A-Za-z0-9\-_]{6}\.[A-Za-z0-9\-_]{27})'
    secret_group: 3
    tags: [discord, messaging]
    remediation: >-
      Discord Developer Portal → 해당 Application → Bot → Reset Token.

  - id: telegram-bot-token
    description: Telegram Bot Token
    severity: high
    keywords: [telegram, api.telegram.org, bot]
    regex: '\b([0-9]{8,10}:AA[A-Za-z0-9\-_]{33})\b'
    secret_group: 1
    tags: [telegram, messaging]
    remediation: >-
      텔레그램에서 @BotFather에게 /revoke 명령을 보내 해당 봇의 토큰을 재발급.

  # ---------------------------------------------------------------- 키/인증서
  - id: private-key
    description: PEM 형식 개인키 (RSA/EC/DSA/OpenSSH/PGP)
    severity: critical
    keywords: ['PRIVATE KEY']
    regex: '-----BEGIN ((RSA|DSA|EC|OPENSSH|PGP|ENCRYPTED) )?PRIVATE KEY( BLOCK)?-----'
    secret_group: 0
    tags: [key, crypto]
    remediation: >-
      이 개인키로 발급된 인증서·SSH 등록·서비스 계정을 해당 서비스(서버 authorized_keys,
      인증기관, 클라우드 IAM 등)에서 즉시 폐기하고 새 키 쌍을 발급하라. 어떤 용도의 키인지에
      따라 절차가 다르므로 파일 경로와 컨텍스트로 용도를 먼저 특정해야 한다.

  - id: jwt
    description: JWT (서명된 토큰, 만료 여부와 무관하게 탐지)
    severity: medium
    keywords: [eyJ]
    regex: '\b(eyJ[A-Za-z0-9\-_]{10,}\.eyJ[A-Za-z0-9\-_]{10,}\.[A-Za-z0-9\-_]{10,})\b'
    secret_group: 1
    tags: [jwt, auth]
    remediation: >-
      발급 시스템에서 해당 세션·리프레시 토큰을 무효화하거나 강제 로그아웃시켜라. 토큰이
      단기 만료라면 서명 키(secret) 자체가 함께 노출됐는지도 점검하고, 그렇다면 서명 키를
      교체해 이미 발급된 모든 토큰을 무효화해야 한다.

  # ---------------------------------------------------------------- 인프라 / DB
  - id: db-connection-string
    description: DB 접속 문자열에 포함된 사용자명/비밀번호
    severity: critical
    keywords: ['://']
    regex: '\b((postgres|postgresql|mysql|mariadb|mongodb|mongodb\+srv|redis|amqp)://[^\s:@/]+:[^\s:@/]+@[^\s/]+)'
    secret_group: 1
    tags: [database, credentials]
    remediation: >-
      해당 DB 계정의 비밀번호를 즉시 변경(ALTER USER / 관리 콘솔)하고, 접속 IP를 제한하는
      방화벽·보안그룹 규칙을 함께 점검하라.

  - id: azure-storage-key
    description: Azure Storage Account Key
    severity: critical
    keywords: [AccountKey=]
    regex: 'AccountKey=([A-Za-z0-9+/=]{86,88})'
    secret_group: 1
    tags: [azure, cloud]
    remediation: >-
      Azure Portal → 해당 Storage Account → Security + networking → Access keys에서
      노출된 키를 Rotate(재생성). 두 키를 번갈아 쓰는 구조라면 나머지 키로 먼저 전환한 뒤
      재생성하면 무중단으로 처리할 수 있다.

  - id: heroku-api-key
    description: Heroku API Key
    severity: high
    keywords: [heroku]
    # HEROKU_API_KEY= 처럼 단어가 이어지는 형태가 실제로 가장 흔하다.
    regex: '(?i)heroku[_\-. ]?(api[_\-. ]?)?(key|token)[^a-zA-Z0-9]{0,20}[''"]?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
    secret_group: 3
    tags: [heroku, cloud]
    remediation: >-
      Heroku Dashboard → Account settings → API Key에서 Regenerate API Key.

  # ---------------------------------------------------------------- 국내 서비스
  #
  # 국내 서비스는 해외 서비스와 사정이 다르다. AWS의 `AKIA`, Stripe의 `sk_live_`처럼
  # 값만 보고 발급처를 특정할 수 있는 접두사를 공식 문서에 못박아 둔 곳이 드물다.
  # 그래서 이 섹션은 두 갈래로 나눠 썼다.
  #
  #   (a) 접두사 기반 — 형식이 공식 문서로 확인되는 것만. 값이 어디에 있든 잡힌다.
  #       카카오 `KakaoAK`, 토스페이먼츠 `test|live_sk_`
  #   (b) 키워드 앵커 기반 — 그 외 전부. `이름 = 값` 형태여야만 잡힌다.
  #       공공데이터포털, 네이버, NCP, 포트원
  #
  # (b)를 택한 이유: 값의 자릿수를 추측해서 접두사 룰을 쓰면 발급처가 형식을 바꾸거나
  # 애초에 추측이 틀렸을 때 **조용히 아무것도 안 잡힌다**. 반면 변수·헤더 이름
  # (`serviceKey`, `X-Naver-Client-Secret`)은 그 서비스를 쓰는 코드라면 반드시 등장하고
  # 바뀔 일도 없다. 미탐을 줄이는 쪽으로 불확실성을 넘긴 선택이다.
  #
  # (b)의 알려진 한계: 값이 이름과 다른 줄에 있으면 줄 단위 스캔으로는 못 잡는다
  # (Twilio에서와 같은 한계다). 그 경우 generic-api-key가 medium으로 받는다.

  - id: kr-public-data-service-key
    description: 공공데이터포털(data.go.kr) 서비스 키
    severity: high
    keywords: [servicekey, service_key, service-key, encodingkey, encoding_key, decodingkey, decoding_key, data.go.kr, publicdata, public_data]
    # 값이 URL 쿼리스트링에 그대로 박히는 일이 잦아(`?serviceKey=...&numOfRows=10`)
    # 따옴표를 선택으로 두고, URL 인코딩된 키(`%2B` `%2F` `%3D%3D`)까지 문자셋에 넣었다.
    #
    # 이름은 세 갈래를 받는다. 포털이 발급 화면에서 키를 "일반 인증키(Encoding)" /
    # "(Decoding)"으로 부르기 때문에 코드에서 serviceKey 대신 encodingKey·decodingKey로
    # 저장하는 경우가 흔하다. 둘은 같은 값의 URL 인코딩 여부만 다른 한 쌍이라 어느 쪽이
    # 유출돼도 같은 키가 유출된 것이다.
    regex: '(?i)(?:(?:service|encoding|decoding)[_\-]?key|(?:data[_\-.]?go[_\-.]?kr|public[_\-.]?data)[_\-.]?(?:api[_\-.]?)?key)\b[^a-zA-Z0-9%]{0,20}[''"]?([A-Za-z0-9%+/=]{40,})'
    secret_group: 1
    entropy: 3.5
    tags: [korea, public-data, gov]
    remediation: >-
      공공데이터포털 → 마이페이지 → 오픈API → 개발계정 상세에서 인증키를 재발급하라.
      일반 인증키(Encoding/Decoding)는 API별이 아니라 **계정 단위**라서, 재발급하면 그
      계정으로 활용신청한 모든 API의 호출 코드를 함께 고쳐야 한다. Encoding 키와
      Decoding 키는 같은 값의 URL 인코딩 여부만 다르므로 둘 중 하나만 유출돼도 둘 다 폐기 대상이다.

  - id: kakao-rest-api-key
    description: 카카오 REST API 키
    severity: high
    keywords: [kakaoak, kakao]
    # 두 가지 표기를 한 룰에서 받는다.
    #   Authorization: KakaoAK <키>   — 헤더 형태
    #   kakao_rest_api_key = "<키>"   — 설정 변수 형태
    # JavaScript 키도 같은 32자리 hex라 값만으로는 구분되지 않는데, 그건 클라이언트에
    # 노출되도록 설계된 공개값이라 시크릿이 아니다. 그래서 값 단독 매칭은 하지 않고
    # 위 두 문맥에서만 잡는다 (JavaScript 키는 어느 쪽에도 등장하지 않는다).
    regex: '(?i)(kakaoak\s+|kakao[_\-.]?rest[_\-.]?api[_\-.]?key\b[^a-zA-Z0-9]{0,20}[''"]?)([0-9a-f]{32})\b'
    secret_group: 2
    entropy: 3.0
    tags: [korea, kakao]
    remediation: >-
      Kakao Developers → 내 애플리케이션 → 앱 키에서 REST API 키를 재발급하라.
      앱 키 재발급은 네 종류(네이티브/REST/JavaScript/Admin)가 각각 따로 동작한다.
      플랫폼 설정에 허용 IP·리다이렉트 URI를 걸어두면 재발급 전까지 피해를 줄일 수 있다.

  - id: kakao-admin-key
    description: 카카오 Admin 키
    severity: critical
    keywords: [kakao]
    # Admin 키는 앱의 모든 API를 사용자 동의 없이 호출할 수 있어 REST API 키보다 위험하다.
    regex: '(?i)kakao[_\-.]?admin[_\-.]?key\b[^a-zA-Z0-9]{0,20}[''"]?([0-9a-f]{32})\b'
    secret_group: 1
    entropy: 3.0
    tags: [korea, kakao]
    remediation: >-
      Kakao Developers → 내 애플리케이션 → 앱 키에서 Admin 키를 즉시 재발급하라.
      Admin 키는 사용자 동의 절차를 건너뛰고 앱 전체를 조작할 수 있으므로 유출 시
      REST API 키보다 우선순위가 높다. 재발급 후 서버 환경변수로만 주입하도록 바꿔라.

  - id: naver-openapi-client-secret
    description: 네이버 오픈API Client Secret
    severity: high
    keywords: [naver]
    # Client ID는 공개 식별자라 제외한다 (Google OAuth Client ID를 뺀 것과 같은 이유).
    # 시크릿 자릿수는 공식 문서에 명시돼 있지 않아 하한만 두고 상한은 넉넉히 잡았다.
    regex: '(?i)(x-naver-client-secret|naver[_\-.]?client[_\-.]?secret)\b[^a-zA-Z0-9]{0,20}[''"]?([A-Za-z0-9_]{8,64})'
    secret_group: 2
    entropy: 2.5
    tags: [korea, naver]
    remediation: >-
      네이버 개발자센터 → Application → 내 애플리케이션 → 해당 앱의 개요에서
      Client Secret을 재발급하라. Client ID는 그대로 유지되므로 시크릿만 교체하면 된다.

  - id: ncp-access-key-id
    description: 네이버 클라우드 플랫폼(NCP) Access Key ID
    severity: high
    keywords: [ncp, ncloud]
    regex: '(?i)(x-ncp-iam-access-key|x-ncp-apigw-api-key-id|ncp[_\-.]?access[_\-.]?key([_\-.]?id)?|ncloud[_\-.]?access[_\-.]?key([_\-.]?id)?)\b[^a-zA-Z0-9]{0,20}[''"]?([A-Za-z0-9]{16,})'
    secret_group: 4
    entropy: 3.0
    tags: [korea, naver, cloud]
    remediation: >-
      NCP 콘솔 → 마이페이지 → 계정 관리 → 인증키 관리에서 해당 인증키를 삭제하고
      새로 생성하라. Access Key ID와 Secret Key는 한 쌍이라 ID만 유출됐어도 쌍 전체를
      교체해야 한다. 서브 계정(IAM) 키라면 서브 계정 메뉴에서 처리한다.

  - id: ncp-secret-key
    description: 네이버 클라우드 플랫폼(NCP) Secret Key
    severity: critical
    # x-ncp-apigw-api-key-id(공개 식별자)는 위 룰이 가져가고, 접미사 없는
    # x-ncp-apigw-api-key(시크릿)만 여기서 받는다. 이름 뒤 `-id`가 붙으면 값 자리에
    # `id`가 와서 이 룰의 값 패턴(연속 20자 이상)이 성립하지 않아 서로 겹치지 않는다.
    keywords: [ncp, ncloud]
    regex: '(?i)(x-ncp-iam-secret-key|x-ncp-apigw-api-key|ncp[_\-.]?secret[_\-.]?key|ncloud[_\-.]?secret[_\-.]?key)\b[^a-zA-Z0-9]{0,20}[''"]?([A-Za-z0-9]{20,})'
    secret_group: 2
    entropy: 3.0
    tags: [korea, naver, cloud]
    remediation: >-
      NCP 콘솔 → 마이페이지 → 계정 관리 → 인증키 관리에서 해당 인증키를 즉시 삭제하라.
      Secret Key는 생성 시점 이후 콘솔에서 다시 조회할 수 없으므로, 재발급하면 이 키를
      쓰던 모든 서버·CI의 설정을 함께 갱신해야 한다.

  - id: toss-payments-secret-key
    description: 토스페이먼츠 시크릿 키
    severity: critical
    keywords: [test_sk_, live_sk_, test_gsk_, live_gsk_]
    # 클라이언트 키(test|live_ck_, test|live_gck_)는 브라우저에 노출되도록 설계된
    # 공개값이라 룰에서 제외한다 (Stripe publishable key를 뺀 것과 같은 이유).
    # 테스트 키(test_...)는 정규식에 걸리긴 하지만 값에 "test"가 들어가 placeholder-value
    # 감점(-60)으로 신뢰도가 min_confidence 아래로 떨어져 리포트에서 빠진다.
    # 실제 결제가 불가능해 유출 피해가 없다는 판단이고, Stripe 테스트 키 처리와 같다.
    regex: '\b((test|live)_g?sk_[A-Za-z0-9]{20,})\b'
    secret_group: 1
    entropy: 3.5
    tags: [korea, payment]
    remediation: >-
      토스페이먼츠 개발자센터 → 내 개발정보 → API 키에서 시크릿 키를 재발급하라.
      클라이언트 키와 시크릿 키는 한 세트로 동작하므로 재발급 후 짝이 맞는지 확인해야
      INVALID_API_KEY가 나지 않는다. 결제 취소·조회 API를 호출할 수 있는 키라서
      유출 시 금전 피해로 직결된다.

  - id: portone-api-secret
    description: 포트원(아임포트) REST API 키/시크릿
    severity: high
    keywords: [imp_key, imp_secret, impkey, impsecret, portone]
    # 가맹점 식별코드(imp########)는 클라이언트에 노출되는 공개값이라 제외한다.
    # imp_key와 imp_secret은 둘이 함께 있어야 액세스 토큰을 받을 수 있어 같이 잡는다.
    regex: '(?i)imp[_\-.]?(key|secret)\b[^a-zA-Z0-9]{0,20}[''"]?([A-Za-z0-9+/=]{20,})'
    secret_group: 2
    entropy: 3.0
    tags: [korea, payment]
    remediation: >-
      포트원 관리자콘솔 → 결제연동 → 식별코드·API Keys에서 REST API Secret을 재발급하라.
      재발급하면 기존 시크릿으로 발급된 액세스 토큰도 함께 무효화되므로 서버 설정을
      동시에 갱신해야 한다.

  # ---------------------------------------------------------------- 일반 패턴
  - id: generic-api-key
    description: 키워드 + 값 형태의 범용 시크릿 (엔트로피 검증 병행)
    severity: medium
    keywords: [key, secret, token, password, passwd, pwd, credential]
    regex: '(?i)\b(api[_\-]?key|apikey|secret[_\-]?key|access[_\-]?token|auth[_\-]?token|client[_\-]?secret|password|passwd|credential)\b\s*[:=]\s*[''"]([A-Za-z0-9\-_=+/\.]{16,})[''"]'
    secret_group: 2
    entropy: 3.5
    tags: [generic]
    remediation: >-
      룰만으로는 어떤 서비스의 키인지 특정할 수 없다. 변수명·주변 코드·파일 경로로 발급처를
      확인한 뒤 해당 서비스의 키 관리 화면에서 폐기하고 재발급하라.

  - id: basic-auth-header
    description: HTTP Basic Auth 헤더에 하드코딩된 인증정보
    severity: high
    keywords: ['Basic ', authorization]
    regex: '(?i)authorization\s*[:=]\s*[''"]?Basic\s+([A-Za-z0-9+/=]{16,})'
    secret_group: 1
    tags: [http, credentials]
    remediation: >-
      Base64를 디코드하면 `사용자명:비밀번호`가 그대로 드러난다. 해당 계정의 비밀번호를
      즉시 변경하라.

# ------------------------------------------------------------------
# 엔트로피 분석 설정
# 정규식 룰로 잡히지 않는 임의 문자열을 Shannon 엔트로피로 탐지한다.
# 임계값이 낮으면 오탐 폭증, 높으면 미탐이 늘어나므로 실측 후 튜닝 필요.
# ------------------------------------------------------------------
entropy:
  enabled: true
  min_length: 20          # 이보다 짧은 문자열은 엔트로피가 신뢰할 수 없어 제외
  max_length: 200         # 미니파이 코드 등 초장문 토큰 제외
  thresholds:
    base64: 4.5           # A-Za-z0-9+/= 로 구성된 문자열
    hex: 3.0              # 0-9a-f 로만 구성된 문자열
  severity: medium

# ------------------------------------------------------------------
# 오탐 필터 설정
# exclude_*  : 스캔 자체를 건너뛰는 하드 제외
# penalties  : 탐지는 하되 신뢰도 점수를 깎는 소프트 감점
# min_confidence 미만은 리포트에서 제외한다 (기본 신뢰도 100에서 시작)
# ------------------------------------------------------------------
filter:
  min_confidence: 50

  exclude_paths:
    - '(^|/)\.git/'
    - '(^|/)(vendor|node_modules|bower_components)/'
    - '(^|/)(dist|build|out|target)/'
    - '\.(min\.js|min\.css|map)$'
    - '(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|go\.sum|Cargo\.lock|Gemfile\.lock)$'
    # baseline 파일은 레포 안에 두고 커밋하는 것이 일반적인 사용법이라, 스캔
    # 대상 디렉토리 안에 있으면 자기 자신도 다시 스캔 대상에 들어간다.
    # 내용이 해시뿐이라 위험하지는 않지만 파일 수 집계가 지저분해지므로 제외한다.
    - '(^|/)\.?secrethound-baseline\.json$'
    # check 커맨드가 만드는 리포트도 같은 이유로 제외한다. 검사한 폴더 안에 리포트를
    # 두고 다시 검사하면 리포트 자신이 스캔 대상이 된다. 값은 마스킹되어 있어 위험하지는
    # 않지만, 파일 수 집계와 결과가 지저분해진다.
    # 리포트 이름에는 검사한 폴더 이름과 중복 번호가 붙으므로(secrethound-report-myrepo-1.html)
    # 그 뒷부분까지 함께 받는다.
    - '(^|/)secrethound-report(-.+)?\.(html|md|json)$'

  exclude_extensions:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .ico
    - .svg
    - .pdf
    - .zip
    - .gz
    - .tar
    - .7z
    - .exe
    - .dll
    - .so
    - .dylib
    - .class
    - .jar
    - .woff
    - .woff2
    - .ttf
    - .mp4
    - .mp3

  # target: path(파일 경로 검사) | value(탐지된 값 자체 검사)
  # pattern 대신 builtin을 쓰면 RE2로 표현 불가능한 규칙을 코드 구현으로 위임한다.
  penalties:
    - id: test-path
      target: path
      pattern: '(^|/)(test|tests|spec|specs|__tests__|testdata|fixtures?)/'
      score: -40
      reason: 테스트 디렉토리의 값은 더미일 가능성이 높음

    - id: example-path
      target: path
      pattern: '(^|/)(examples?|samples?|demos?|docs?)/'
      score: -40
      reason: 예제/문서 디렉토리의 값은 플레이스홀더일 가능성이 높음

    - id: test-file-suffix
      target: path
      pattern: '(_test\.(go|py|js|ts|rb|java)|\.test\.(js|ts|tsx)|\.spec\.(js|ts|tsx))$'
      score: -35
      reason: 테스트 파일

    - id: env-example-file
      target: path
      pattern: '(\.env\.(example|sample|template)|\.env\.dist)$'
      score: -50
      reason: .env 예시 파일은 실제 값이 아닌 템플릿

    # 짧은 단어(my, ab 등)를 넣으면 무작위 문자열에 우연히 포함되어 실제 시크릿을
    # 놓치게 된다. 미탐은 오탐보다 손해가 크므로 4자 이상 단어만 사용한다.
    - id: placeholder-value
      target: value
      pattern: '(?i)(example|sample|dummy|placeholder|changeme|redacted|fake|test|your[_\-]|xxxx+|0{8,}|1234567890|abcdefgh)'
      score: -60
      reason: 값 자체가 플레이스홀더 문구를 포함

    - id: repeated-chars
      target: value
      builtin: repeated-chars
      score: -50
      reason: 같은 문자가 8회 이상 반복되어 마스킹된 값으로 추정됨

    # 로컬 엔드포인트를 가리키는 접속 문자열은 개발용 설정이지 유출된 자격증명이 아니다.
    # 경로 기반 감점보다 일반적으로 적용되므로 .env.example 외의 위치에서도 동작한다.
    - id: local-endpoint
      target: value
      pattern: '(?i)@(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])[:/]'
      score: -60
      reason: 로컬 개발 엔드포인트를 가리키는 접속 문자열

  # 특정 룰/파일/값을 명시적으로 무시 (스캔 후 확인된 오탐 등록용)
  allowlist:
    rule_ids: []
    paths: []
    secrets: []
