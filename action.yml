name: secrethound
description: Git 레포에서 유출된 API 키와 시크릿을 탐지한다
author: whiteclover0542

branding:
  icon: search
  color: red

inputs:
  path:
    description: 스캔할 경로
    required: false
    default: "."
  history:
    description: git 커밋 히스토리까지 스캔할지 여부
    required: false
    default: "false"
  max-commits:
    description: 히스토리 스캔 대상 커밋 수 제한 (0 = 전체)
    required: false
    default: "0"
  rules:
    description: 사용자 룰셋 파일 경로 (비우면 내장 룰셋)
    required: false
    default: ""
  fail-on-detection:
    description: 시크릿 탐지 시 워크플로를 실패시킬지 여부
    required: false
    default: "true"
  report-path:
    description: JSON 리포트를 저장할 경로 (비우면 저장하지 않음)
    required: false
    default: ""
  baseline-path:
    description: 이 baseline 파일에 있는 시크릿은 제외하고 새로 생긴 것만 탐지 (비우면 미사용)
    required: false
    default: ""
  version:
    description: 사용할 secrethound 릴리스 태그 (비우면 최신 릴리스)
    required: false
    default: ""

outputs:
  findings:
    description: 탐지된 시크릿 건수
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    # 릴리스에 올라간 실행 파일을 받아 쓴다. 이렇게 해야 이 액션을 쓰는 워크플로가
    # setup-go 를 따로 넣지 않아도 된다. 받지 못하는 경우(릴리스 이전 커밋을 참조,
    # 네트워크 문제 등)에만 소스에서 빌드하는 예전 방식으로 되돌아간다.
    - name: Install secrethound
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail

        repo="whiteclover0542/secrethound"
        bindir="$RUNNER_TEMP/secrethound-bin"
        mkdir -p "$bindir"

        case "$(uname -s)" in
          Linux)  os=linux ;;
          Darwin) os=darwin ;;
          *)      os="" ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)  arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *)             arch="" ;;
        esac

        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          version=$(curl -fsSL "https://api.github.com/repos/$repo/releases/latest" \
            | grep -m1 '"tag_name"' | cut -d'"' -f4)
        fi

        ok=0
        if [ -n "$os" ] && [ -n "$arch" ] && [ -n "$version" ]; then
          url="https://github.com/$repo/releases/download/$version/secrethound_${version}_${os}_${arch}.tar.gz"
          echo "다운로드: $url"
          if curl -fsSL "$url" | tar -xz -C "$bindir" secrethound; then
            chmod +x "$bindir/secrethound"
            echo "$bindir" >> "$GITHUB_PATH"
            ok=1
          fi
        fi

        if [ "$ok" -ne 1 ]; then
          echo "::warning::릴리스 바이너리를 받지 못해 소스에서 빌드합니다 (Go 필요)"
          if ! command -v go > /dev/null; then
            echo "::error::Go가 없어 빌드할 수 없습니다. 워크플로에 actions/setup-go 를 추가하거나, 릴리스가 올라간 버전을 지정하세요"
            exit 2
          fi
          go install "github.com/$repo/cmd/secrethound@latest"
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_HISTORY: ${{ inputs.history }}
        INPUT_MAX_COMMITS: ${{ inputs.max-commits }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_FAIL: ${{ inputs.fail-on-detection }}
        INPUT_REPORT: ${{ inputs.report-path }}
        INPUT_BASELINE: ${{ inputs.baseline-path }}
      run: |
        set -uo pipefail

        report="${INPUT_REPORT:-$RUNNER_TEMP/secrethound-report.json}"

        args=("$INPUT_PATH" --no-color --report "$report" --exit-code=false)
        [ "$INPUT_HISTORY" = "true" ] && args+=(--history)
        [ "$INPUT_MAX_COMMITS" != "0" ] && args+=(--max-commits "$INPUT_MAX_COMMITS")
        [ -n "$INPUT_RULES" ] && args+=(--rules "$INPUT_RULES")
        [ -n "$INPUT_BASELINE" ] && args+=(--baseline "$INPUT_BASELINE")

        # --exit-code=false 로 두고 탐지 여부는 리포트를 보고 판단한다.
        # 이렇게 해야 "시크릿 탐지"와 "도구 실행 실패"를 구분할 수 있다.
        secrethound scan "${args[@]}"
        status=$?
        if [ $status -ne 0 ]; then
          echo "::error::secrethound 실행에 실패했습니다 (종료 코드 $status)"
          exit 2
        fi

        count=$(grep -o '"findings": *[0-9]*' "$report" | head -1 | grep -o '[0-9]*$')
        count="${count:-0}"
        echo "findings=$count" >> "$GITHUB_OUTPUT"

        if [ "$count" -gt 0 ]; then
          echo "::error::시크릿 ${count}건이 탐지되었습니다. 노출된 키는 즉시 폐기(revoke)해야 합니다"
          if [ "$INPUT_FAIL" = "true" ]; then
            exit 1
          fi
        fi
        exit 0
